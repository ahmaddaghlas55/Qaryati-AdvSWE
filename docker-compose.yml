services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: qaryati
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: qaryati
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaryati -d qaryati"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://qaryati:${DB_PASSWORD}@db:5432/qaryati
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  # redis:
  #   image: redis:7-alpine

volumes:
  pgdata: